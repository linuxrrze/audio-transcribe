[project]
name = "transcribe"
version = "0.1.0"
description = "Local live audio transcription with speaker identification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "platformdirs>=4.2",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    # speech recognition
    "faster-whisper>=1.1",
    "av<19",  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 19
    "soundfile>=0.12",
    "soxr>=0.4",
    # diarization + voiceprints (core listed explicitly: the lock otherwise misses it)
    "sherpa-onnx>=1.12",
    "sherpa-onnx-core>=1.12",
    # microphone (Linux additionally needs the PortAudio library: libportaudio2)
    "sounddevice>=0.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
secure = ["cryptography>=42", "keyring>=25"]
system = ["soundcard>=0.4; sys_platform == 'win32'"]  # Linux: parec, macOS: Swift helper
# Former extras, now part of the base install; kept so old install commands still work.
asr = []
speakers = []
audio = []

[project.scripts]
tx = "transcribe.cli.main:app"

[project.gui-scripts]
tx-gui = "transcribe.gui.app:main"

[project.entry-points."transcribe.sources"]
file = "transcribe.audio.file:FileSource"
mic = "transcribe.audio.mic:MicSource"

[project.entry-points."transcribe.embedders"]
sherpa-onnx = "transcribe.speakers.embedder:SherpaEmbedder"

[project.entry-points."transcribe.asr"]
faster-whisper = "transcribe.asr.faster_whisper:FasterWhisperEngine"
"whisper.cpp" = "transcribe.asr.whisper_cpp:WhisperCppEngine"

[project.entry-points."transcribe.diarizers"]
sherpa-onnx = "transcribe.diarize.sherpa_offline:SherpaDiarizer"

[project.entry-points."transcribe.exporters"]
txt = "transcribe.export.txt:TxtExporter"
md = "transcribe.export.md:MarkdownExporter"
srt = "transcribe.export.srt:SrtExporter"
vtt = "transcribe.export.srt:VttExporter"
json = "transcribe.export.json:JsonExporter"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
packaging = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded models (run with TX_SLOW=1)"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*", "soundcard", "keyring", "keyring.*", "ctranslate2", "faster_whisper.*", "faster_whisper", "sherpa_onnx", "sounddevice", "soundfile", "soxr"]
ignore_missing_imports = true
