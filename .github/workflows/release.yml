name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # secrets cannot be used in `if:` directly; expose whether signing is configured
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Build system-audio helper (macOS)
        if: runner.os == 'macOS'
        run: helpers/macos-audiotap/build.sh
      - run: >-
          uv sync --group packaging --extra gui --extra secure --extra system
      - run: uv run python packaging/build.py
      - name: Sign and notarize (macOS, when credentials are configured)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/sign_and_notarize.sh dist/Transcribe.app
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  deb:
    uses: ./.github/workflows/deb.yml

  # A signed flat apt index; with the .deb in the same release it makes
  # releases/latest/download/ an apt repository (packaging/linux/publish-apt.sh).
  apt:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb
      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "::error::secret APT_SIGNING_KEY is not set"; exit 1; }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Write the index
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_REPO_URL: https://github.com/${{ github.repository }}/releases/latest/download/
        run: packaging/linux/publish-apt.sh apt deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: apt
          path: apt/*
          if-no-files-found: error

  publish:
    needs: [bundle, deb, apt]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes

  # Install from the published repository the way the README tells users to.
  apt-test:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:24.04", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    env:
      REPO: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - name: Add the repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSLo /usr/share/keyrings/transcribe-archive-keyring.gpg \
            "$REPO/transcribe-archive-keyring.gpg"
          curl -fsSLo /etc/apt/sources.list.d/transcribe.sources "$REPO/transcribe.sources"
          apt-get update
      - name: Install
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y transcribe
          dpkg-query -W transcribe | grep -F "${GITHUB_REF_NAME#v}"
          tx version

